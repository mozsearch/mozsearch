[term.C]
alias = "context"

# For graphing we need to build the pipeline through the traverse call but we
# have the "graph-symbols" group automatically add the graphing steps.
[term.calls-to]
[[term.calls-to.group.graph-symbols-default]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.calls-to.group.graph-symbols-default]]
command = "crossref-lookup"
args.exact-match = true
[[term.calls-to.group.graph-traverse]]
command = "traverse"
args.edge = "uses"

# The diagram terms' "-sym" variants take symbols rather than pretty names (ex:
# for a web spec's terms, whose pretty names other definitions share), in
# groups of their own (whose crossref-lookups take no input), so that a query
# can have both (ex: calls-between-source-sym with calls-between-target).
[term.calls-to-sym]
[[term.calls-to-sym.group.graph-symbols-default-sym]]
command = "crossref-lookup"
args.positional = "$0"
[[term.calls-to-sym.group.graph-traverse]]
command = "traverse"
args.edge = "uses"

[term.calls-from-sym]
[[term.calls-from-sym.group.graph-symbols-default-sym]]
command = "crossref-lookup"
args.positional = "$0"
[[term.calls-from-sym.group.graph-traverse]]
command = "traverse"
args.edge = "callees"

[term.calls-between-sym]
[[term.calls-between-sym.group.graph-symbols-default-sym]]
command = "crossref-lookup"
args.positional = "$0"
args.methods = true
[[term.calls-between-sym.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true

[term.calls-between-source-sym]
[[term.calls-between-source-sym.group.graph-symbols-source-sym]]
command = "crossref-lookup"
args.positional = "$0"
args.methods = true
[[term.calls-between-source-sym.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true

[term.calls-between-target-sym]
[[term.calls-between-target-sym.group.graph-symbols-target-sym]]
command = "crossref-lookup"
args.positional = "$0"
args.methods = true
[[term.calls-between-target-sym.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true

[term.inheritance-diagram-sym]
[[term.inheritance-diagram-sym.group.graph-symbols-default-sym]]
command = "crossref-lookup"
args.positional = "$0"
[[term.inheritance-diagram-sym.group.graph-traverse]]
command = "traverse"
args.edge = "inheritance"

[term.class-diagram-sym]
[[term.class-diagram-sym.group.graph-symbols-default-sym]]
command = "crossref-lookup"
args.positional = "$0"
[[term.class-diagram-sym.group.graph-traverse]]
command = "traverse"
args.edge = "class"


[term.calls-between]
[[term.calls-between.group.graph-symbols-default]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.calls-between.group.graph-symbols-default]]
command = "crossref-lookup"
args.exact-match = true
args.methods = true
[[term.calls-between.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true


[term.calls-between-source]
[[term.calls-between-source.group.graph-symbols-source]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.calls-between-source.group.graph-symbols-source]]
command = "crossref-lookup"
args.exact-match = true
args.methods = true
[[term.calls-between-source.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true

[term.calls-between-target]
[[term.calls-between-target.group.graph-symbols-target]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.calls-between-target.group.graph-symbols-target]]
command = "crossref-lookup"
args.exact-match = true
args.methods = true
[[term.calls-between-target.group.graph-traverse]]
command = "traverse"
args.edge = "uses"
args.paths-between = true

[term.calls-from]
[[term.calls-from.group.graph-symbols-default]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.calls-from.group.graph-symbols-default]]
command = "crossref-lookup"
args.exact-match = true
[[term.calls-from.group.graph-traverse]]
command = "traverse"
args.edge = "callees"


# "inheritance-diagram" is a quick hack to show the full transitive overrides/
# overriddenBy relationship.
[term.inheritance-diagram]
[[term.inheritance-diagram.group.graph-symbols-default]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.inheritance-diagram.group.graph-symbols-default]]
command = "crossref-lookup"
args.exact-match = true
[[term.inheritance-diagram.group.graph-traverse]]
command = "traverse"
args.edge = "inheritance"

# "class-diagram" currently tries to show the relationship between a given
# class and other classes exclusively via fields, but it would be good to also:
# - Traverse IPC communication relationships
# - Be more intentional/explicit about inheritance; we may do something.
[term.class-diagram]
[[term.class-diagram.group.graph-symbols-default]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
args.types-only = true
[[term.class-diagram.group.graph-symbols-default]]
command = "crossref-lookup"
args.exact-match = true
[[term.class-diagram.group.graph-traverse]]
command = "traverse"
args.edge = "class"

# "block-diagram" shows how areas of the code interact, from crossref's
# roll-ups of the calls between their functions (see `cmd_block_diagram`):
# "block-diagram:*" the whole tree's subsystems, "block-diagram:Core/DOM/Workers"
# a subsystem's classes (clustered by subsystem) and their neighbors, or a
# class's symbol its neighbors.
[term.block-diagram]
[[term.block-diagram.group.block-diagram]]
command = "block-diagram"
args.positional = "$0"
[[term.block-diagram.group.graph-render]]
command = "graph"
args.hier = "subsystem"

[term.block-level]
[[term.block-level.group.block-diagram]]
command = "block-diagram"
args.level = "$0"

[term.block-min-count]
[[term.block-min-count.group.block-diagram]]
command = "block-diagram"
args.min-count = "$0"

[term.block-edges]
[[term.block-edges.group.block-diagram]]
command = "block-diagram"
args.edges = "$0"

[term.block-no-accessors]
[[term.block-no-accessors.group.block-diagram]]
command = "block-diagram"
args.no-accessors = true

[term.block-max-edges]
[[term.block-max-edges.group.block-diagram]]
command = "block-diagram"
args.max-edges = "$0"

# The whole tree's block diagram as a diagram per group of the subsystems most
# tied by their calls in trees with at least this many subsystems (20 by
# default).
# The whole tree's subsystems in a column, with their strongest calls as arcs
# (`arcs`), rather than block diagrams (`diagram`).
[term.block-view]
[[term.block-view.group.block-diagram]]
command = "block-diagram"
args.view = "$0"

[term.block-groups-at]
[[term.block-groups-at.group.block-diagram]]
command = "block-diagram"
args.groups-at = "$0"

[term.block-with]
[[term.block-with.group.block-diagram]]
command = "block-diagram"
args.with = "$0"

[term.fmus-through-depth]
[[term.fmus-through-depth.group.graph-traverse]]
command = "traverse"
args.traverse-field-member-uses = "$0"

# (Over block diagrams' default.)
[term.hier]
[[term.hier.group.graph-render]]
command = "graph"
priority = 1
args.hier = "$0"

[term.colorize-callees]
[[term.colorize-callees.group.graph-render]]
command = "graph"
args.colorize-callees = "$0"

[term.graph-debug]
[[term.graph-debug.group.graph-render]]
command = "graph"
args.debug = true

[term.graph-format]
[[term.graph-format.group.graph-render]]
command = "graph"
priority = 1
args.format = "$0"

[term.graph-layout]
[[term.graph-layout.group.graph-render]]
command = "graph"
priority = 1
args.layout = "$0"

# This previously was doing a broken thing to try and avoid creating a weird
# situation if this was specified before "calls-to", but it didn't actually do
# what it thought it was doing because the earlier stages were not actually
# associated with "term.depth" but instead "term.calls-to".  Noting this here
# in case that somehow was doing something important and this breaks things...
[term.depth]
[[term.depth.group.graph-traverse]]
command = "traverse"
args.max-depth = "$0"

# We enforce a range in our clap definition, so this is fine to expose.
[term.node-limit]
[[term.node-limit.group.graph-traverse]]
command = "traverse"
args.node-limit = "$0"

# We enforce a range in our clap definition, so this is fine to expose.
[term.paths-between-node-limit]
[[term.paths-between-node-limit.group.graph-traverse]]
command = "traverse"
args.paths-between-node-limit = "$0"

# How many of a symbol's callers to include when traversing its uses (see
# `OverloadKind::UsesCallers`).  We do not enforce a range limit on this
# because the node-limit ends up dominating.  ("path-limit" is its old name,
# from when the limit was on the files with uses.)
[term.caller-limit]
[[term.caller-limit.group.graph-traverse]]
command = "traverse"
args.caller-limit = "$0"

# Diagrams leave out test code's calls (the uses in test files, by their path
# kind) unless asked to include them, and traces, slicings and taint audits
# leave out its calls and field uses.  (Amending, so it doesn't start a
# traversal or a trace of its own.)
[term.include-tests]
[[term.include-tests.group.graph-traverse]]
command = "traverse"
amend = true
args.include-tests = true
[[term.include-tests.group.dataflow]]
command = "dataflow"
amend = true
args.include-tests = true
[[term.include-tests.group.slicing]]
command = "dataflow"
amend = true
args.include-tests = true

[term.path-limit]
alias = "caller-limit"

# Only follow callers in classes on paths between the sources' and targets'
# classes in crossref's call roll-ups (see `traverse --rollup-guide`).
[term.rollup-guide]
[[term.rollup-guide.group.graph-traverse]]
command = "traverse"
args.rollup-guide = true

[term.ignore-nodes]
[[term.ignore-nodes.group.graph-traverse]]
command = "traverse"
args.ignore-nodes = "$0"

[term.context]
[[term.context.group.display]]
command = "augment-results"
args.before = "$0"
args.after = "$0"

[term.field-layout]
[[term.field-layout.group.semantic-lookup]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.field-layout.group.semantic-lookup]]
command = "crossref-lookup"
args.exact-match = true
[[term.field-layout.group.semantic-format]]
command = "format-symbols"
args.mode = "field-layout"

# The default term is what gets applied to things without a term.  It can also
# be explicitly referenced by other terms.
[term.default]
[[term.default.expand]]
term = "file"
[[term.default.expand]]
term = "idprefix"
[[term.default.expand]]
term = "text"
[[term.default.expand]]
term = "removals"

[term.file]
[[term.file.group.file-search]]
command = "search-files"
args.positional = "$0"

[term.id]
# We can't do this and `idprefix` in the same command and it's not clear it's
# worth the effort to support both simultaneously.
conflicts = ["idprefix"]
[[term.id.group.semantic-search]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = true
[[term.id.group.semantic-search]]
command = "crossref-lookup"
args.exact-match = true
[[term.id.group.semantic-search]]
command = "crossref-expand"

[term.idprefix]
[[term.idprefix.group.semantic-search]]
command = "search-identifiers"
args.positional = "$0"
args.exact-match = false
[[term.idprefix.group.semantic-search]]
command = "crossref-lookup"
[[term.idprefix.group.semantic-search]]
command = "crossref-expand"

[term.pathre]
[[term.pathre.group.file-search]]
command = "search-files"
args.pathre = "$0"
## TODO: Implement filtering crossref output by path
## does this really want to be its own stage, or just part of crossref-lookup?
## I guess this may need to come after crossref-expand, so then it would want
## to be its own command.
#[[term.pathre.group.semantic-search]]
#command = "filter-crossref"
#args.pathre = "$0"
[[term.pathre.group.text-search]]
command = "search-text"
args.pathre = "$0"

[term.p]
alias = "path"

[term.path]
[[term.path.expand]]
term = "pathre"
transforms = ["path_glob"]

# Case-sensitivity: the text and identifiers a query searches, if it does,
# ignore case, but with `case:sensitive` (ex: router.py's search's
# "Case-sensitive" option), and so do token histories, which otherwise are of
# the token's case variant with the most removals.
[term.case]
values = ["sensitive", "insensitive"]
[[term.case.group.text-search]]
command = "search-text"
when = "sensitive"
amend = true
args.case-sensitive = true
[[term.case.group.semantic-search]]
command = "search-identifiers"
when = "sensitive"
amend = true
args.case-sensitive = true
[[term.case.group.removal-search]]
command = "token-history"
when = "sensitive"
amend = true
args.case-sensitive = true
[[term.case.group.token-history]]
command = "token-history"
when = "sensitive"
amend = true
args.case-sensitive = true
[[term.case.group.token-timeline]]
command = "token-timeline"
when = "sensitive"
amend = true
args.case-sensitive = true

# The paths to leave out, a regexp: `-path:`'s and `-pathre:`'s, which
# chew_query combines (only these terms can be negated), from the files and
# the text the query searches, if it does.
[term.not-pathre]
[[term.not-pathre.group.file-search]]
command = "search-files"
amend = true
args.not-pathre = "$0"
[[term.not-pathre.group.text-search]]
command = "search-text"
amend = true
args.not-pathre = "$0"

[term.re]
[[term.re.group.text-search]]
command = "search-text"
args.re = "$0"

[term.show-cols]
[[term.show-cols.group.semantic-format]]
command = "format-symbols"
args.show-cols = "$0"

[term.hide-cols]
[[term.hide-cols.group.semantic-format]]
command = "format-symbols"
args.hide-cols = "$0"

[term.sym]
alias = "symbol"

[term.symbol]
[[term.symbol.group.semantic-search]]
command = "search-identifiers"
args.add-sym = "$0"
[[term.symbol.group.semantic-search]]
command = "crossref-lookup"
[[term.symbol.group.semantic-search]]
command = "crossref-expand"

# Following values (see tools/src/dataflow/): where the value of a symbol (a
# local, parameter, field or global) goes, or comes from, from the line
# `follow-at` gives as "<path>#<line>" (as the context menu's "Follow value"
# items do), as a subway map of the functions it goes through (see
# static/js/subway.js): `follow-format` shows something else (svg, the
# dataflow graph; json, text, dot).
[term.follow-forward]
[[term.follow-forward.group.dataflow]]
command = "dataflow"
args.symbol = "$0"
args.direction = "forward"
args.format = "subway"

[term.follow-backward]
[[term.follow-backward.group.dataflow]]
command = "dataflow"
args.symbol = "$0"
args.direction = "backward"
args.format = "subway"

[term.follow-format]
[[term.follow-format.group.dataflow]]
command = "dataflow"
priority = 1
args.format = "$0"

[term.follow-at]
[[term.follow-at.group.dataflow]]
command = "dataflow"
args.at = "$0"

[term.follow-hops]
[[term.follow-hops.group.dataflow]]
command = "dataflow"
args.max-hops = "$0"

# Slicing a revision's changes (a commit's, or `<a>..<b>`'s) into the clusters
# of dataflow they touch (see tools/src/dataflow/slice.rs), in the coordinates
# of the query's revision (the indexed one, or, with `rev`, a try push's
# head's), as a subway map (see static/js/subway.js): `slice-cluster` shows
# one of them (1 for the biggest), and `slice-format` (svg, the dataflow
# graph; json, text, dot; lines, its changed functions' lines on their
# dataflow, see tools/src/dataflow/impact.rs) something other than the map.
[term.slice-rev]
[[term.slice-rev.group.slicing]]
command = "dataflow"
args.slice-rev = "$0"
args.format = "subway"

[term.slice-cluster]
[[term.slice-cluster.group.slicing]]
command = "dataflow"
args.slice-cluster = "$0"

[term.slice-format]
[[term.slice-format.group.slicing]]
command = "dataflow"
priority = 1
args.format = "$0"

# Taint in a slicing's subway map (see tools/src/dataflow/taint.rs), besides
# ontology-mapping.toml's labels: values of these (comma-separated) types from
# content processes (and from these functions' parameters, `taint-from`), and
# these validators' calls (validating all of their arguments).
[term.taint-type]
[[term.taint-type.group.slicing]]
command = "dataflow"
args.taint-type = "$0"

[term.detaint-by]
[[term.detaint-by.group.slicing]]
command = "dataflow"
args.detaint-by = "$0"

[term.taint-from]
[[term.taint-from.group.slicing]]
command = "dataflow"
args.taint-from = "$0"

# The functions receiving a type's values from content processes (the `Recv`
# methods of messages with parameters of the type), as a subway map of their
# uses of them and their validations (see tools/src/dataflow/taint.rs).
[term.taint-audit]
[[term.taint-audit.group.slicing]]
command = "dataflow"
args.taint-audit = "$0"
args.format = "subway"

# (As it is, rather than as an escaped `re:`, so that search-text knows it's a
# text: one wider than codesearch takes is searched for by a piece of it.)
# A crash signature's stack beside its frames' code (crash-stats' signatures,
# ex: "OOM | large | NS_ABORT_OOM | ..."; see crash_stack.rs), which the DWIM
# rule for crash-stats signatures' URLs goes to.
[term.crash-signature]
[[term.crash-signature.group.crash]]
command = "crash-stack"
args.positional = "$0"

[term.text]
[[term.text.group.text-search]]
command = "search-text"
args.positional = "$0"

# What the history says about the removals of the token searched for (see
# hyperblame/token_history.rs), which the results note if they removed more of
# its instances than the results have (ex: a class since renamed; see
# cmd_compile_results.rs).
[term.removals]
[[term.removals.group.removal-search]]
command = "token-history"
args.positional = "$0"

# A token's history: the commits which removed most of its instances, what
# replaced it, and its journal's records (see hyperblame/token_history.rs).
[term.token-history]
[[term.token-history.group.token-history]]
command = "token-history"
args.positional = "$0"
args.view = true

# The tokens of the history's journals matching a pattern: `Foo*` those
# starting with `Foo`, `*Foo` those ending with it, and `Foo` those containing
# it, case- and accent-insensitively (see file_format/token_names.rs).
[term.token-names]
[[term.token-names.group.token-names]]
command = "token-names"
args.positional = "$0"

# Tokens' timelines, a line each, of their instances (with their case
# variants') by week, with markers at the weeks changing them the most (see
# hyperblame/token_timeline.rs and static/js/token-timeline.js): each
# `token-timeline:` term adds its token.
[term.token-timeline]
[[term.token-timeline.group.token-timeline]]
command = "token-timeline"
args.positional = "$0"

[group.file-search]
output = "file-search"
junction = "compile"

[group.semantic-search]
output = "semantic-search"
junction = "compile"

[group.text-search]
output = "text-search"
junction = "compile"

[group.removal-search]
output = "removal-search"
junction = "compile"

[junction.compile]
command = "compile-results"
output = "compiled"
next = "display"

[group.display]
output = "result"
[[group.display.commands]]
command = "augment-results"

[group.graph-symbols-source]
output = "source"
junction = "graph-fuse-symbols"

[group.graph-symbols-target]
output = "target"
junction = "graph-fuse-symbols"

[group.graph-symbols-default]
output = "default"
junction = "graph-fuse-symbols"

[group.graph-symbols-source-sym]
output = "source-sym"
junction = "graph-fuse-symbols"

[group.graph-symbols-target-sym]
output = "target-sym"
junction = "graph-fuse-symbols"

[group.graph-symbols-default-sym]
output = "default-sym"
junction = "graph-fuse-symbols"

[junction.graph-fuse-symbols]
command = "fuse-crossrefs"
output = "fused-symbols"
next = "graph-traverse"

[group.graph-traverse]
output = "graph"
next = "graph-render"

[group.block-diagram]
output = "graph"
next = "graph-render"

[group.graph-render]
output = "result"
[[group.graph-render.commands]]
command = "graph"
args.format = "mozsearch"

[group.dataflow]
output = "result"

[group.slicing]
output = "result"

[group.crash]
output = "result"

[group.token-history]
output = "result"

[group.token-timeline]
output = "result"

[group.token-names]
output = "result"

[group.semantic-lookup]
output = "semantic-lookup"
next = "semantic-filter"

[group.semantic-filter]
output = "semantic-filter"
next = "semantic-format"

[group.semantic-format]
output = "result"
