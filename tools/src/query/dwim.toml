# The DWIM ("do what I mean") rules (see dwim.rs; bug 1908776): where what a
# person searches for (`/search`'s input, in a tree searching with queries)
# may be, if it's something one has (ex: another tool's URL of a file), as the
# current best advice for it: they aren't a stable interface, and are likely
# to become queries over time.  The query's page says where (with the rule's
# `description`) beside the results of searching for it, and goes there if
# the search finds nothing.
#
# The first rule whose `pattern` (a regexp) matches all of the input (trimmed)
# is where its `redirect` is, a URL (or the tree's path), with `{tree}` and the
# pattern's named captures substituted (as they are: they're parts of a URL
# already), and `[...]` left out where a capture in it didn't match.  A rule
# with `exists` only applies if the tree has the path that capture names.

[[rule]]
name = "wpt-sync-pr"
description = "A web-platform-tests pull request: its sync bugs."
pattern = '^(?:https?://)?github\.com/web-platform-tests/wpt/pull/(?P<pr>\d+)(?:[/?#]\S*)?$'
redirect = 'https://bugzilla.mozilla.org/buglist.cgi?quicksearch=%22Sync%20PR%20{pr}%22'

[[rule]]
name = "searchfox-file"
description = "Another tree's file: the file in this tree."
pattern = '^https?://searchfox\.org/[^/]+/(?:source|rev/[0-9a-f]+)/(?P<path>[^?#]*)(?:\?[^#]*)?(?P<fragment>#\S*)?$'
redirect = '/{tree}/source/{path}[{fragment}]'
exists = "path"

[[rule]]
name = "github-file"
description = "A file on GitHub: the file in this tree."
pattern = '^https?://github\.com/[^/]+/[^/]+/(?:blob|tree)/[^/]+/(?P<path>[^?#]*)(?:\?[^#]*)?(?:#L(?P<line>\d+)(?:-L(?P<end>\d+))?)?$'
redirect = '/{tree}/source/{path}[#{line}][-{end}]'
exists = "path"

[[rule]]
name = "hg-file"
description = "A file on hg.mozilla.org: the file in this tree."
pattern = '^https?://hg(?:-edge)?\.mozilla\.org/[^?#]+?/(?:file|annotate|raw-file|log)/[0-9a-f]+/(?P<path>[^?#]*)(?:\?[^#]*)?(?:#l(?P<line>\d+))?$'
redirect = '/{tree}/source/{path}[#{line}]'
exists = "path"

[[rule]]
name = "crash-stats-signature"
description = "A crash-stats signature: its stack, beside its frames' code."
pattern = '^https?://crash-stats\.mozilla\.org/signature/\?(?:\S*?&)?signature=(?P<signature>[^&#\s]+)\S*$'
redirect = "/{tree}/query/default?q=crash-signature%3A%27{signature}%27"

[[rule]]
name = "path-line"
description = "A path and line (ex: from a compiler's error or a stack): the line."
pattern = '^(?:/builds/worker/checkouts/gecko/)?(?P<path>(?:[\w.+-]+/)+[\w.+-]+\.\w+)(?::(?P<line>\d+))(?::\d+)?:?$'
redirect = '/{tree}/source/{path}#{line}'
exists = "path"
