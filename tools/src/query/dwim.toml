# The DWIM ("do what I mean") rules (see dwim.rs; bug 1908776): where what a
# person searches for (`/search`'s input, in a tree searching with queries)
# may be, if it's something one has (ex: another tool's URL of a file), as the
# current best advice for it: they aren't a stable interface, and are likely
# to become queries over time.  The query's page says where (with the rule's
# `description`) beside the results of searching for it, and goes there if
# the search finds nothing.
#
# The first rule whose `pattern` (a regexp) matches all of the input (trimmed)
# is where its `redirect` is, a URL (or the tree's path), with `{tree}` and the
# pattern's named captures substituted (as they are: they're parts of a URL
# already), and `[...]` left out where a capture in it didn't match.  A rule
# with `exists` only applies if the tree has the path that capture names.  A
# rule with `lookup` rather than `redirect` is where that lookup of its
# captures says, if it finds anything, else it doesn't apply (ex: "spec": a
# web spec's URL's spec, in the tree or its `SPEC_` linked tree, whose
# rendered view, at the URL's anchor, it is; see `format::dwim_lookup` for
# them all).
#
# A rule with `go = "always"` goes there at once, without searching (when
# what the search would find, ex: code citing the URL, isn't what one has the
# URL for), and the page it goes to (if it's searchfox's) offers the search;
# the others go there if the search finds nothing, else say where above its
# results.

[[rule]]
name = "wpt-sync-pr"
description = "A web-platform-tests pull request: its sync bugs."
pattern = '^(?:https?://)?github\.com/web-platform-tests/wpt/pull/(?P<pr>\d+)(?:[/?#]\S*)?$'
redirect = 'https://bugzilla.mozilla.org/buglist.cgi?quicksearch=%22Sync%20PR%20{pr}%22'
go = "always"

[[rule]]
name = "spec-pr"
description = "A spec repository's pull request on GitHub: its page as a try push (its import), in the tree of specs which has the spec."
pattern = '^https?://github\.com/(?P<repo>[^/\s]+/[^/\s]+)/pull/(?P<number>\d+)(?:[/?#]\S*)?$'
lookup = "spec-pr"
go = "always"

[[rule]]
name = "treeherder-try"
description = "A try push on Treeherder: its page (its import), in the tree importing this tree's try pushes."
pattern = '^https?://treeherder\.mozilla\.org/(?:#/)?jobs\?(?P<params>\S+)$'
lookup = "treeherder-try"
go = "always"

[[rule]]
name = "commit"
description = "A commit on GitHub: its page, in this tree (or another which has it)."
pattern = '^https?://github\.com/[^/\s]+/[^/\s]+/commit/(?P<rev>[0-9a-f]{7,40})(?:[/?#]\S*)?$'
lookup = "commit"
go = "always"

[[rule]]
name = "hg-commit"
description = "A commit on hg.mozilla.org: its page, in this tree."
pattern = '^https?://hg(?:-edge)?\.mozilla\.org/[^?#\s]+?/(?:rev|raw-rev|diff|json-rev)/(?P<rev>[0-9a-f]{12,40})(?:[/?#]\S*)?$'
lookup = "hg-commit"
go = "always"

[[rule]]
name = "bugzilla-comment"
description = "A Bugzilla bug's comment: its blocks, beside the code they link to."
pattern = '^https?://(?:bugzilla\.mozilla\.org/(?:show_bug\.cgi\?(?:\S*?&)?id=)?|bugzil\.la/)(?P<bug>\d+)(?:&[^#\s]*)?#c(?P<comment>\d+)$'
redirect = "/{tree}/query/default?q=bug-comment%3A{bug}%2F{comment}"
go = "always"

[[rule]]
name = "bugzilla-bug"
description = "A Bugzilla bug: the commits which mention it, in this tree's history."
pattern = '^https?://(?:bugzilla\.mozilla\.org/(?:show_bug\.cgi\?(?:\S*?&)?id=)?|bugzil\.la/)(?P<bug>\d+)(?:[&#]\S*)?$'
lookup = "explore-bug"
go = "always"

[[rule]]
name = "phabricator-revision"
description = "A Phabricator revision: the commits which mention it, in this tree's history."
pattern = '^https?://phabricator\.services\.mozilla\.com/(?P<rev>D\d+)(?:[/?#]\S*)?$'
lookup = "explore-phab"
go = "always"

[[rule]]
name = "searchfox-file"
description = "Another tree's file: the file in this tree."
pattern = '^https?://searchfox\.org/[^/]+/(?:source|rev/[0-9a-f]+)/(?P<path>[^?#]*)(?:\?[^#]*)?(?P<fragment>#\S*)?$'
redirect = '/{tree}/source/{path}[{fragment}]'
exists = "path"

[[rule]]
name = "github-file"
description = "A file on GitHub: the file in this tree."
pattern = '^https?://github\.com/[^/]+/[^/]+/(?:blob|tree)/[^/]+/(?P<path>[^?#]*)(?:\?[^#]*)?(?:#L(?P<line>\d+)(?:-L(?P<end>\d+))?)?$'
redirect = '/{tree}/source/{path}[#{line}][-{end}]'
exists = "path"

[[rule]]
name = "hg-file"
description = "A file on hg.mozilla.org: the file in this tree."
pattern = '^https?://hg(?:-edge)?\.mozilla\.org/[^?#]+?/(?:file|annotate|raw-file|log)/[0-9a-f]+/(?P<path>[^?#]*)(?:\?[^#]*)?(?:#l(?P<line>\d+))?$'
redirect = '/{tree}/source/{path}[#{line}]'
exists = "path"

[[rule]]
name = "crash-stats-report-all"
description = "A crash-stats report, after \"all\": every thread's stack, beside its frames' code."
pattern = '^all\s+https?://crash-stats\.mozilla\.org/report/index/(?:bp-)?(?P<id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\S*$'
redirect = "/{tree}/query/default?q=crash-report%3A{id}%20crash-threads%3Aall"
go = "always"

[[rule]]
name = "crash-stats-report"
description = "A crash-stats report (or its ID as Bugzilla has them, bp-..., since a bare UUID could be an interface's): its stack, beside its frames' code."
pattern = '^(?:https?://crash-stats\.mozilla\.org/report/index/(?:bp-)?|bp-)(?P<id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:[/?#]\S*)?$'
redirect = "/{tree}/query/default?q=crash-report%3A{id}"
go = "always"

[[rule]]
name = "crash-stats-signature"
description = "A crash-stats signature: its stack, beside its frames' code."
pattern = '^https?://crash-stats\.mozilla\.org/signature/\?(?:\S*?&)?signature=(?P<signature>[^&#\s]+)\S*$'
redirect = "/{tree}/query/default?q=crash-signature%3A%27{signature}%27"
go = "always"

[[rule]]
name = "spec-url"
description = "A web spec's URL: the spec's rendered view, at its anchor."
pattern = '^(?P<url>https?://[^\s#]+)(?:#(?P<anchor>\S*))?$'
lookup = "spec"
go = "always"

[[rule]]
name = "path-line"
description = "A path and line (ex: from a compiler's error or a stack): the line."
pattern = '^(?:/builds/worker/checkouts/gecko/)?(?P<path>(?:[\w.+-]+/)+[\w.+-]+\.\w+)(?::(?P<line>\d+))(?::\d+)?:?$'
redirect = '/{tree}/source/{path}#{line}'
exists = "path"
