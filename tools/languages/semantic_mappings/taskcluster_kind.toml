# Taskcluster kinds' kind.yml (see semantic_analyzer.rs and
# taskcluster_tasks.toml): the tasks of `tasks:` (or the older `jobs:`) define
# `TASK_<kind>/<name>` (the kind is the directory's name), and
# `kind-dependencies` and `tasks-from` link to the kinds' and tasks' files.
#
# Contexts: kind.yml defines the kind, `TCKIND_<kind>`, which is the
# outermost context of its files' records (see taskcluster_tasks_from.toml);
# its tasks and its `task-defaults` (`TASKDEFAULTS_<kind>`) are the contexts
# of the records inside them, and each task uses the task-defaults, as it
# inherits them.  Pretty names are `<kind>::<name>`, so that a task's name is
# an identifier (its kind being its namespace).
grammar = "yaml"
paths = ["**/taskcluster/kinds/*/kind.yml"]

[file_scope]
sym = "TCKIND_{{ dir }}"
pretty = "{{ dir }}"
define = true

[[data]]
path = "tasks/*"
role = "def"
sym = "TASK_{{ dir }}/{{ value }}"
pretty = "{{ dir }}::{{ value }}"
syntax_kind = "task"
scope = true

[data.structured]
kind = "task"
impl_kind = "taskcluster"

[[data.inherits]]
when = "task-defaults"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"

[[data.inherits]]
when = "job-defaults"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"

[[data]]
path = "jobs/*"
role = "def"
sym = "TASK_{{ dir }}/{{ value }}"
pretty = "{{ dir }}::{{ value }}"
syntax_kind = "task"
scope = true

[data.structured]
kind = "task"
impl_kind = "taskcluster"

[[data.inherits]]
when = "task-defaults"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"

[[data.inherits]]
when = "job-defaults"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"

[[data]]
path = "task-defaults"
role = "def"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"
syntax_kind = "task-defaults"
scope = true

[data.structured]
kind = "task"
impl_kind = "taskcluster"

[[data]]
path = "job-defaults"
role = "def"
sym = "TASKDEFAULTS_{{ dir }}"
pretty = "{{ dir }}::task-defaults"
syntax_kind = "task-defaults"
scope = true

[data.structured]
kind = "task"
impl_kind = "taskcluster"

[[data]]
path = "kind-dependencies/[]"
at = "value"
role = "use"
sym = "FILE_{{ path | split: '/kinds/' | first | append: '/kinds/' | append: value | append: '/kind.yml' | at_escape }}"
pretty = "{{ path | split: '/kinds/' | first }}/kinds/{{ value }}/kind.yml"
syntax_kind = "file"

[[data]]
path = "tasks-from/[]"
at = "value"
role = "use"
sym = "FILE_{{ dir_path | append: '/' | append: value | at_escape }}"
pretty = "{{ dir_path }}/{{ value }}"
syntax_kind = "file"
