# The specs of the "wubspecs" tree: each is a top-level directory of the
# tree's forest repository, with the history of its upstream repository's
# branch (see tools/src/spec_forest.rs and build-spec-forest).

# The forest's root .gitattributes: specs' HTML-based sources are tokenized
# as such for history (see tools/src/tree_sitter_support/spec_tokenizer.rs),
# including the HTML Standard's `source` (and the `index` it generated, which
# its repository had until 2012), and old specs' XML and Anolis `.src` files.
# (Bikeshed's `.bs` files are tokenized as Bikeshed by default.)
attributes = """
*.html searchfox-lang=spec-html
*.htm searchfox-lang=spec-html
*.xml searchfox-lang=spec-html
*.src searchfox-lang=spec-html
html/source searchfox-lang=spec-html
html/index searchfox-lang=spec-html
"""

