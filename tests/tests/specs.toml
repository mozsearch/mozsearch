# The test tree's web specs (see tools/src/spec_analyze and
# scripts/spec-analyze.sh): its Wattsi, ecmarkup and Bikeshed fixtures, and DOM
# and HTML, which they refer to.

[[spec]]
name = "example"
path = "specs"
format = "wattsi"
rendered = "https://example.spec.whatwg.org/"

[[spec]]
name = "dom"
rendered = "https://dom.spec.whatwg.org/"

[[spec]]
name = "ecmaexample"
path = "specs/ecma"
format = "ecmarkup"
rendered = "https://example.github.io/ecma/"

# (Its index and its rendering are `bikeshed index --html example-bs-output.html
# example.bs example-bs-index.json`'s, from mozsearch's fork of Bikeshed, which
# the test tree doesn't have.)
[[spec]]
name = "examplebs"
path = "specs"
format = "bikeshed"
source = "example.bs"
index = "example-bs-index.json"
output = "example-bs-output.html"
rendered = "https://example.github.io/bs/"

[[spec]]
name = "html"
rendered = "https://html.spec.whatwg.org/"

# (A later level of the example spec, in its series, which defines none of its
# terms, so that citations of them are of the example spec's; see
# tools/src/spec_analyze/citations.rs.)
[[spec]]
name = "example-2"
series = "example"
rendered = "https://example.spec.whatwg.org/2/"
