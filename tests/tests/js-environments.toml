# The tests tree's JS environments (see tools/src/js_environments/rules.rs
# and files/jsenv/): xpcshell, mochitest and browser-chrome tests (with a
# scope), by the moz.build variables declaring their manifests, and JS shell
# tests by their paths; and web-platform-tests' (files/testing/web-platform/,
# ex: jsenv-pages/), with Test262's.
load_globals = ["xpcshell", "js-shell"]
# (Its helpers are in a function it calls at once.)
unwrap = ["jsenv/shell/shell.js", "testing/web-platform/tests/resources/testharness.js"]

[[flavors]]
name = "xpcshell"
manifest_variables = ["XPCSHELL_TESTS_MANIFESTS"]
global = "xpcshell"

[[flavors]]
name = "mochitest"
manifest_variables = ["MOCHITEST_MANIFESTS"]
global = "window"

[[flavors]]
name = "browser-chrome"
manifest_variables = ["BROWSER_CHROME_MANIFESTS"]
global = "browser-window"
harness = ["jsenv/harness/browser-test.js"]
implicit_head = ["head.js"]
[flavors.scope]
file = "jsenv/harness/browser-test.js"
constructor = "testScope"

[[path_flavors]]
name = "shell"
include = ["jsenv/shell/tests/*.js"]
global = "js-shell"
dir_heads_root = "jsenv/shell"
dir_heads = ["shell.js"]

[wpt]
root = "testing/web-platform/tests"
window_harness = ["resources/testharness.js"]
worker_harness = ["resources/testharness.js"]
extra_roots = { "/_mozilla/" = "testing/web-platform/mozilla/tests" }

[wpt.test262]
tests = ["third_party/test262/test"]
harness = ["third_party/test262/harness/assert.js", "third_party/test262/harness/sta.js"]
includes_dir = "third_party/test262/harness"

[urls]
"/tests/" = ""

# (Their environments are analyzed with scip-typescript, with TypeScript's
# types; see js_environments_analysis in config.json.)
[globals.window]
lib = ["ESNext", "DOM"]
# (Browser-chrome tests' DOM is the tree's lib replacement's, files/jsenv/types/,
# as Firefox's browser-chrome tests' tsconfig, tools/@types/tsconfig.json's, is
# Gecko's typings.)
[globals.browser-window]
extends = "jsenv/types/tsconfig.json"
[globals.xpcshell]
lib = ["ESNext"]
[globals.dedicatedworker]
lib = ["ESNext", "WebWorker"]
[globals.js-shell]
lib = ["ESNext"]
