# ## Test code
#
# Roll-ups (crossref's, when indexing) and diagrams leave out test code: its
# calls, and the calls of it, unless they're asked for (the query language's
# `include-tests:true`), as tests (ex: gtests, mochitests) obscure how the
# code calls itself.  Test code is that of test files (per-file-info.toml's
# `pathkind.test`, ex: gtest directories), and of test frameworks:
# - `frameworks`: prefixes of test frameworks' paths, whose code is test code
#   wherever it's used, and whose macros make test code (a gtest's TEST is
#   defined in its file, wherever that is, and, by its macros, in
#   googletest's headers);
# - `subsystems`: tests' subsystems (names, or prefixes ending in "/"), which
#   block diagrams leave out.
[tests]
frameworks = [
  "third_party/googletest/",
  "testing/gtest/",
]
subsystems = [
  "Testing/",
]

# ## The whole tree's overview
#
# `infrastructure`: subsystems (names, or prefixes ending in "/") that most
# code uses as plumbing, or through generated code, which the whole tree's
# block diagram draws as it does the subsystems most others use: their boxes
# say how many subsystems use them, and the calls into them aren't drawn, so
# that the diagram shows how the other subsystems interact.  (IPC's messages
# are still drawn, between their senders' and their receivers' subsystems:
# roll-ups count a message's `Send` as a call of its actors' `Recv`s.)  Those
# called by at least half of the subsystems are drawn so anyway (ex: XPCOM,
# MFBT, strings, the memory allocator); these are those that aren't, but are
# plumbing too: ex: mozglue (process-wide glue, ex: its timestamps and clocks,
# which a group of the overview's subsystems all called, a quarter of its
# edges).
[overview]
infrastructure = [
  "Core/IPC",
  "Core/DOM/Bindings (WebIDL)",
  "Core/mozglue",
]
