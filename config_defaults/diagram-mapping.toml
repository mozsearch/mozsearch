# What calls diagrams (calls-from:, and the traversals of callees of
# calls-between:; see tools/src/cmd_pipeline/diagram_mapping.rs) leave out:
# calls of infrastructure and generic data manipulation (ex: assertions,
# Result's methods, nsCOMPtr's operators, strings' and arrays' methods), which
# most functions make, so that their nodes and edges don't crowd out how the
# code's logic calls itself.  A diagram's legend says which groups of calls it
# left out, and links to it with them (the query language's `show-calls:`,
# ex: "show-calls:strings", or "show-calls:all").  A diagram of a group's
# function (ex: calls-from:'nsTSubstring::Append') shows that group's calls.
# The roll-ups that block diagrams draw (crossref's, when indexing) leave the
# groups' calls out too (but a group's calls of its own), so that their edges
# and counts (ex: how many subsystems use another) are without them.
#
# Read when a diagram is made (the config repo's own diagram-mapping.toml,
# else this one), so changing it doesn't need a reindex, but for the
# roll-ups, which are as it was when the tree was indexed.
#
# Each `[[left-out]]` group has:
# - `group`: its key, for `show-calls:`;
# - `name`: what the legend calls it;
# - `why`: why its calls aren't worth showing, for people;
# - `functions`: pretty names without template arguments (as in
#   dataflow-mapping.toml), matched whole, or prefixes ending in "::" for all
#   of a class's (or namespace's) functions, or, starting with "*::", a
#   function's name in any class or namespace, or its prefix, ending in "*"
#   (ex: "*::AssertIsOn*" for AssertIsOnBackgroundThread and every class's
#   AssertIsOnOwningThread);
# - `paths`: prefixes of the paths of functions' definitions (ex:
#   "xpcom/string/" for a directory, or "xpcom/ds/nsTArray" for nsTArray.h
#   and nsTArray-inl.h), for the functions all of whose definitions are
#   there;
# - `getters`: whether it's the group of getters, the methods whose dataflow
#   summaries say they only return a field and which call nothing (a
#   heuristic, for the functions the other groups don't name).
# A function's group is its name's, else its longest prefix's, else its last
# name's ("*::"), else its definitions' longest path prefix's, else the
# getters' if it's one.  The
# groups are in the legend in this order.

[[left-out]]
group = "assertions"
name = "Assertions and crashes"
why = "What the expansions of MOZ_ASSERT, MOZ_RELEASE_ASSERT, MOZ_DIAGNOSTIC_ASSERT, MOZ_CRASH, NS_ASSERTION, NS_WARNING and NS_ENSURE_* call (in debug builds, for the assertions), the NS_IsMainThread() they mostly check, and the functions asserting which thread runs them or which locks it holds (AssertIsOnBackgroundThread, AssertIsOnOwningThread, AssertCurrentThreadOwns, NS_ASSERT_OWNINGTHREAD): they check the code's logic rather than being part of it."
functions = [
  "*::AssertIsOn*",
  "*::AssertIsIn*",
  "*::AssertCurrentThread*",
  "*::AssertNotCurrentThread*",
  "nsAutoOwningThread::",
  "AnnotateMozCrashReason",
  "MOZ_AssertAssignmentTest",
  "MOZ_Crash",
  "MOZ_CrashPrintf",
  "MOZ_CrashSequence",
  "MOZ_NoReturn",
  "MOZ_ReportAssertionFailure",
  "MOZ_ReportCrash",
  "MOZ_StripRelativeComponents",
  "NS_DebugBreak",
  "NS_IsMainThread",
  "NS_warn_if_impl",
  "abort",
  "mozalloc_abort",
  "mozilla::detail::InvalidArrayIndex_CRASH",
]
paths = [
  "mfbt/Assertions.",
  "mfbt/StaticAnalysisFunctions.h",
  "xpcom/base/nsDebug.h",
  "xpcom/base/nsDebugImpl.",
]

