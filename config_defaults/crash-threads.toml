kind = "condition variable"
functions = [
    "mozilla::detail::ConditionVariableImpl::wait*",
    "mozilla::OffTheBooksCondVar::Wait*",
    "mozilla::CondVar::Wait*",
    "mozilla::Monitor::Wait*",
