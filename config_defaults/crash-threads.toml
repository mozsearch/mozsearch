# How the crash view describes a crash report's threads (see
# tools/src/crash_threads.rs): what each thread is (its kind, by its name or
# its stack, and who owns it), what it was doing when the crash happened (its
# state: idle at its normal wait for work, waiting elsewhere, active, or
# notable, ex: shutting down), and which of its frames are infrastructure
# (layers: the thread's start, its event loop, its pool), which the view
# collapses.  A config repo's crash-threads.toml replaces this one.
#
# Patterns are of functions' names without their arguments (ex:
# "nsThread::ProcessNextEvent", Rust's "<Type>::method" as "Type::method",
# and a thunk's as its function's), or of threads' names, with "*" for any characters.  A thread's name the crash reporter truncated (ex:
# "TaskCon~ller") matches a name it could be.  Frames found by scanning the
# stack (`trust = "scan"`), which may not be the thread's, aren't matched.

# ## Waits
#
# The functions a thread blocked in (at its stack's top, innermost): the
# operating systems' and Gecko's synchronization primitives, and I/O and event
# waits.  (Unsymbolized frames at the top, ex: a system library's without
# symbols, are a wait's if a wait follows them.)
