# ## Notable frames
#
# Frames which make a thread's state notable, rather than idle (they stay
# expanded, and their callers if `called_by` says which, and a nested event
# loop's inner loops): ex: a nested event loop, or shutting down.
[[notable]]
state = "nested event loop"
functions = ["mozilla::SpinEventLoopUntil*", "SpinEventLoopUntil*"]

[[notable]]
state = "shutting down"
functions = [
    "nsThread::Shutdown*",
    "nsThreadManager::Shutdown",
    "mozilla::ShutdownXPCOM",
    "mozilla::AppShutdown::*",
    "nsThreadPool::Shutdown*",
    "mozilla::TaskController::Shutdown*",
]

# ## Threads
#
# What a thread is, by its name (patterns, `names`) or else its stack (any of
# its frames' functions, `stack`): its kind, its owner (ex: a Bugzilla
# component, or the module a third party's code is in), and the functions
# its waits are in when it's idle (beside the defaults below), and its own
# notable frames.  The first which matches is its.
[defaults]
# (Any thread waiting for its event loop's next event is idle.)
idle = [
    "mozilla::ThreadEventQueue::GetEvent",
    "mozilla::EventQueueInternal<*>::GetEvent",
    "nsThread::ProcessNextEvent",
    "NS_ProcessNextEvent",
    "MessageLoop::Run",
    "mozilla::widget::WinUtils::WaitForMessage",
]
# The frames which are an event loop's levels: a thread's are nested (its
# state "nested event loop") if it has more than its kind's `loops` (1 unless
# it says, ex: a DOM Worker's own loop runs in its thread's).
loops = ["nsThread::ProcessNextEvent"]

# The modules of a thread's frames which are Gecko's and the operating
# systems' and their libraries': a thread no rule describes is the owner's
# whose module its first frame (innermost, under its waits) of neither is in
# (ex: a graphics driver's), else Gecko's or the system's.
[modules]
gecko = ["xul.dll", "libxul.so", "XUL", "firefox.exe", "firefox", "plugin-container", "plugin-container.exe", "mozglue.dll", "libmozglue.so", "libmozglue.dylib", "nss3.dll", "libnss3.so", "libnss3.dylib", "nspr4.dll", "libnspr4.so", "libplc4.so", "libplds4.so", "libnssutil3.so", "libssl3.so", "libsmime3.so", "libsoftokn3.so", "libfreeblpriv3.so", "libipcclientcerts.so", "freebl3.dll", "softokn3.dll", "lgpllibs.dll", "liblgpllibs.so", "libmozsqlite3.so", "libmozsandbox.so", "gkcodecs.dll", "libgkcodecs.so", "mozavcodec.dll", "mozavutil.dll", "libmozavcodec.so", "libmozavutil.so", "libmozavcodec.dylib", "libmozavutil.dylib", "libmozgtk.so", "libmozwayland.so"]
system = ["ntdll.dll", "kernel32.dll", "KERNELBASE.dll", "kernelbase.dll", "ucrtbase.dll", "msvcrt.dll", "msvcp140.dll", "vcruntime140.dll", "user32.dll", "win32u.dll", "combase.dll", "rpcrt4.dll", "ws2_32.dll", "mswsock.dll", "libc.so.6", "libpthread.so.0", "libm.so.6", "libdl.so.2", "libstdc++.so.6", "libglib-2.0.so.0", "libgio-2.0.so.0", "libgobject-2.0.so.0", "libsystem_kernel.dylib", "libsystem_pthread.dylib", "libsystem_c.dylib", "libdispatch.dylib", "libc++.1.dylib", "libc++abi.dylib", "CoreFoundation", "Foundation", "AppKit", "libobjc.A.dylib", "linux-gate.so", "linux-vdso.so.1", "libart.so", "libc.so", "libbase.so"]

