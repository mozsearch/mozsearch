# ### Dataflow hints ###
#
# What functions do with data where the dataflow analysis (tools/src/dataflow/)
# can't see it: their implementations are beyond it (ex: Gecko's string
# classes' buffer sharing and copying, in xpcom/string) or too costly to
# analyze for every trace.  crossref gives each function's symbols (all of
# its overloads and instantiations, by its pretty name without template
# arguments) a summary with these flows, which traces step over its calls by
# (shown as "(hint)" nodes).
#
# `flows` are "from -> to", or "from ~> to" if the value is derived from it
# (ex: converted between encodings), with the ports "this" (for a constructor,
# the object it constructs), "return" and "argN" (as a destination, what's
# written through it).  `why` says why, for people reading traces.  Hints
# should be things the analysis would conclude if it could see; they're
# reviewed like code.

[pretty."nsTSubstring::nsTSubstring".dataflow]
flows = ["arg0 -> this"]
