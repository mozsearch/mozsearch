# What dataflow traces (tools/src/dataflow/; see mapping.rs) treat as black
# boxes: functions that are machinery the code's logic goes through rather
# than logic of its own (ex: mfbt's Result and its helpers).  A trace doesn't
# step into a call of one: the call's result (and for a constructor, the
# object it makes) comes from its arguments and object, as for calls the
# analysis can't see into, without a note saying so.  The diagrams show each
# group's calls as one collapsed node, whose context menu can show their
# internals (the trace again, stepping into them; see the query language's
# `follow-internals:`).
#
# Read when a trace runs (the config repo's own dataflow-mapping.toml, else
# this one), so changing it doesn't need a reindex.
#
# Each `[[black-box]]` has:
# - `group`: its key, for `follow-internals:` (ex: "follow-internals:result",
#   or "all");
# - `name`: what the diagrams call it;
# - `why`: why its internals aren't worth following, for people;
# - `functions`: pretty names without template arguments (as in
#   ontology-mapping.toml's dataflow hints), matched whole, or prefixes
#   ending in "::" for all of a class's (or namespace's) functions.

[[black-box]]
group = "result"
name = "Result machinery"
why = "mfbt's Result wraps a value or an error: its methods, its implementations' packing strategies and its conversions (ToResult, Err) move the value in and out, as their callers' code says, so their internals don't say more about where it goes."
functions = [
  "mozilla::Result::",
  "mozilla::detail::ResultImplementation::",
  "mozilla::detail::ResultImplementationNullIsOkBase::",
  "mozilla::detail::ResultImplementationNullIsOk::",
  "mozilla::detail::UnusedZero::",
  "mozilla::detail::UnusedZeroEnum::",
  "mozilla::GenericErrorResult::",
  "mozilla::ResultTypeTraits::",
  "mozilla::Err",
  "mozilla::ToResult",
  "NS_FAILED_impl",
  "NS_SUCCEEDED_impl",
]

[[black-box]]
group = "quota-errors"
name = "QM_TRY's error handling"
why = "dom/quota's QM_TRY macros report and convert errors (HandleError, LogError, QMResult): their callers' QM_TRY says what happens to the value and its errors."
functions = [
  "mozilla::dom::quota::HandleError",
  "mozilla::dom::quota::LogError",
  "mozilla::dom::quota::MakeSourceFileRelativePath",
  "mozilla::dom::quota::ErrToOk",
  "mozilla::dom::quota::ErrToDefaultOk",
  "mozilla::dom::quota::detail::",
  "mozilla::QMResult::",
  "mozilla::ToQMResult",
]

[[black-box]]
group = "xpcom-factory"
name = "XPCOM's component factories"
why = "Creating or getting an XPCOM component goes through the component manager and the generated StaticComponents.cpp's switch over every component: the code's logic is the component it asked for, not those internals."
functions = [
  "mozilla::xpcom::CreateInstanceImpl",
  "mozilla::xpcom::ConstructESModuleComponent",
  "mozilla::xpcom::CallInitFunc",
  "nsComponentManagerImpl::",
  "nsCreateInstanceByCID::",
  "nsCreateInstanceByContractID::",
  "nsCreateInstanceFromFactory::",
  "nsGetServiceByCID::",
  "nsGetServiceByCIDWithError::",
  "nsGetServiceByContractID::",
  "nsGetServiceByContractIDWithError::",
  "do_CreateInstance",
  "do_GetService",
  "CallCreateInstance",
  "CallGetService",
]

# (Its callers' calls are of its interfaces' methods, ex: a statement's
# `BindUTF8StringAsBlobByName`, declared by mozIStorageBindingParams, which
# its statements and their parameters' bindings all implement.  Not its
# callback interfaces, which its callers implement.)
[[black-box]]
group = "storage"
name = "mozStorage"
why = "mozStorage runs SQL in SQLite: binding a value hands it to SQLite, and a statement's results come out of the database, which a trace can't follow through the SQL, so its statements', bindings' and connections' internals (their proxies, copies and variants) aren't where the code's logic is."
functions = [
  "mozilla::storage::",
  "mozIStorageAsyncConnection::",
  "mozIStorageAsyncStatement::",
  "mozIStorageBaseStatement::",
  "mozIStorageBindingParams::",
  "mozIStorageBindingParamsArray::",
  "mozIStorageConnection::",
  "mozIStorageError::",
  "mozIStoragePendingStatement::",
  "mozIStorageResultSet::",
  "mozIStorageRow::",
  "mozIStorageService::",
  "mozIStorageStatement::",
  "mozIStorageValueArray::",
  "mozStorageStatementScoper::",
  "mozStorageTransaction::",
]

# ## Macros
#
# Function-like macros whose invocations the diagrams with source listings
# (ex: traces' subway maps) show as one block of their arguments, each
# labeled, in order, by `args` (an invocation passing fewer, as variadic
# macros' do, has fewer).  `signature` is its documented form, for people.
# (Their dataflow is their expansions'.)

[[macro]]
names = ["QM_TRY"]
signature = "QM_TRY(expr[, customRetVal, cleanup, predicate])"
args = ["tries", "on error, returns", "on error, also runs", "reports the error if"]

[[macro]]
names = ["QM_TRY_UNWRAP", "QM_TRY_INSPECT"]
signature = "QM_TRY_UNWRAP(target, expr[, customRetVal, cleanup])"
args = ["into", "tries", "on error, returns", "on error, also runs"]

[[macro]]
names = ["QM_TRY_RETURN"]
signature = "QM_TRY_RETURN(expr[, customRetVal, cleanup])"
args = ["returns", "on error, returns", "on error, also runs"]

[[macro]]
names = ["QM_FAIL"]
signature = "QM_FAIL(retVal[, cleanup])"
args = ["returns", "also runs"]

[[macro]]
names = ["QM_WARNONLY_TRY", "QM_INFOONLY_TRY", "QM_VERBOSEONLY_TRY"]
signature = "QM_WARNONLY_TRY(expr[, cleanup])"
args = ["tries, reporting errors", "on error, also runs"]

[[macro]]
names = ["QM_WARNONLY_TRY_UNWRAP", "QM_INFOONLY_TRY_UNWRAP", "QM_VERBOSEONLY_TRY_UNWRAP"]
signature = "QM_WARNONLY_TRY_UNWRAP(target, expr[, cleanup])"
args = ["into, if it succeeds", "tries, reporting errors", "on error, also runs"]

[[macro]]
names = ["QM_OR_ELSE_WARN", "QM_OR_ELSE_INFO", "QM_OR_ELSE_LOG_VERBOSE"]
signature = "QM_OR_ELSE_WARN(expr, fallback)"
args = ["tries", "on error, falls back to"]

[[macro]]
names = ["QM_OR_ELSE_WARN_IF", "QM_OR_ELSE_INFO_IF", "QM_OR_ELSE_LOG_VERBOSE_IF"]
signature = "QM_OR_ELSE_WARN_IF(expr, predicate, fallback)"
args = ["tries", "on errors for which", "falls back to"]

[[macro]]
names = ["MOZ_TRY"]
signature = "MOZ_TRY(expr)"
args = ["tries (its value, if it succeeds)"]

[[macro]]
names = ["NS_ENSURE_SUCCESS"]
signature = "NS_ENSURE_SUCCESS(res, ret)"
args = ["checks", "on failure, returns"]

[[macro]]
names = ["NS_ENSURE_TRUE"]
signature = "NS_ENSURE_TRUE(x, ret)"
args = ["checks", "if false, returns"]

[[macro]]
names = ["NS_ENSURE_FALSE"]
signature = "NS_ENSURE_FALSE(x, ret)"
args = ["checks", "if true, returns"]
